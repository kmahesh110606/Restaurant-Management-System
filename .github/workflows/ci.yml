name: Restaurant Management Service CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test -- --reporter=default --reporter=junit --outputFile=../test-results/frontend.xml
        working-directory: client
      - run: npm run build
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-results
          path: test-results/

  django:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rms_ci
          POSTGRES_USER: rms_ci
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rms_ci -d rms_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: server.ci_settings
      RMS_CI_DB_PASSWORD: ci-disposable-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - name: Validate models and migrations
        working-directory: server
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Django unit and API integration tests on PostgreSQL
        working-directory: server
        run: python -m coverage run --source=restaurant manage.py test restaurant --noinput -v 2
      - name: Coverage reports
        if: always()
        working-directory: server
        run: |
          python -m coverage xml --omit="*/migrations/*,*/tests.py,*/test_*.py" -o ../test-results/django-coverage.xml
          python -m coverage report --omit="*/migrations/*,*/tests.py,*/test_*.py" --fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: django-results
          path: test-results/

  selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend, django]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: npm ci
        working-directory: client
      - name: Chrome browser acceptance tests
        run: python tests/selenium/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-results
          path: test-results/selenium/
